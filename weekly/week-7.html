
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>다양한 입력 폼</title>
</head>
<body>

<h2>다양한 입력 폼</h2>

<form>
    <table border="1">
        <tr>
            <th>검색어</th>
            <td>
                <input type="text" name="search">
            </td>
        </tr>

        <tr>
            <th>캠퍼스</th>
            <td>
                <input type="radio" name="campus" value="서울">서울
                <input type="radio" name="campus" value="천안">천안
            </td>
        </tr>

        <tr>
            <th>직업</th>
            <td>
                <select name="job">
                    <option value="">선택하세요</option>
                    <option value="학생">학생</option>
                    <option value="회사원">회사원</option>
                    <option value="교수">교수</option>
                    <option value="기타">기타</option>
                </select>
            </td>
        </tr>

        <tr>
            <th>구입희망분야<br>(복수선택 가능)</th>
            <td>
                분야:
                <input type="checkbox" name="field" value="컴퓨터">컴퓨터
                <input type="checkbox" name="field" value="경제">경제
                <input type="checkbox" name="field" value="상식">상식
            </td>
        </tr>

        <tr>
            <th>비고</th>
            <td>
                <textarea name="memo" rows="4" cols="40"></textarea>
            </td>
        </tr>

        <tr>
            <td colspan="2" align="center">
                <input type="submit" value="전송">
                <input type="reset" value="취소">
                <input type="button" value="확인">
            </td>
        </tr>
    </table>
</form>

</body>
</html>
