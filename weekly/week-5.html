
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>스타일시트 이해하기</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }

        h1 {
            color: blue;
        }

        p {
            color: gray;
        }

        a {
            color: green;
            text-decoration: none;
        }

        a:hover {
            color: red;
            text-decoration: underline;
        }

        ul li {
            padding: 8px;
        }

        ul li:first-child {
            color: blue;
        }

        ul li:last-child {
            color: red;
        }

        ul li:nth-child(2) {
            background-color: lightyellow;
        }

        .box p {
            color: purple;
        }
    </style>
</head>
<body>

    <h1>스타일시트 이해하기</h1>

    <p>CSS를 사용하면 HTML 요소의 모양을 바꿀 수 있습니다.</p>

    <h2>링크에 마우스를 올려 보세요.</h2>
    <a href="https://www.smu.ac.kr">상명대학교</a>

    <h2>목록 선택자</h2>
    <ul>
        <li>첫 번째 항목</li>
        <li>두 번째 항목</li>
        <li>세 번째 항목</li>
    </ul>

    <h2>선택자 조합</h2>
    <div class="box">
        <p>이 문장은 보라색으로 표시됩니다.</p>
    </div>

</body>
</html>
